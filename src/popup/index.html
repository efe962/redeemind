<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redeemind</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #172033;
      }
      .voucher > span {
        min-width: 0;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #111827;
          color: #f3f4f6;
        }
      }
      body {
        margin: 0;
        min-width: 320px;
        max-width: 440px;
      }
      main {
        padding: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 12px;
      }
      section {
        position: relative;
        z-index: 1;
        overflow: visible;
        background: color-mix(in srgb, Canvas 94%, #2563eb);
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 12px;
        margin-top: 12px;
      }
      label {
        display: grid;
        gap: 4px;
        margin: 8px 0;
        font-size: 0.85rem;
      }
      input,
      select,
      button {
        position: relative;
        z-index: 2;
        font: inherit;
        padding: 8px;
        border-radius: 7px;
        border: 1px solid #94a3b8;
      }
      button {
        cursor: pointer;
        background: #2563eb;
        color: white;
        border: 0;
      }
      button.secondary {
        background: transparent;
        color: inherit;
        border: 1px solid #94a3b8;
      }
      .icon-button {
        width: 36px;
        min-width: 36px;
        padding: 6px;
        text-align: center;
        font-size: 1.1rem;
      }
      .voucher {
        display: flex;
        min-width: 0;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #cbd5e1;
      }
      .voucher:last-child {
        border-bottom: 0;
      }
      .code {
        font-weight: 700;
        color: #2563eb;
      }
      .muted {
        color: #64748b;
        font-size: 0.85rem;
      }
      .expiry-warning {
        color: #b45309;
        font-weight: 600;
        font-size: 0.85rem;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .row > * {
        flex: 1;
      }
      output {
        display: block;
        margin-top: 8px;
        min-height: 1.2em;
      }
      .disclosure {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: start;
        background: transparent;
        color: inherit;
        border: 0;
        padding: 0;
      }
      .disclosure-icon {
        font-size: 1.25rem;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="popupTitle">Vouchers for this site</h1>
      <section><div id="vouchers" aria-live="polite"></div></section>
      <section>
        <button
          id="add-toggle"
          class="disclosure"
          type="button"
          aria-expanded="false"
          aria-controls="add-panel"
        >
          <span data-i18n="addVoucher">Add voucher</span>
          <span class="disclosure-icon" aria-hidden="true">+</span>
        </button>
        <div id="add-panel" hidden>
          <form id="add-form">
            <label><span data-i18n="domain">Domain</span><input name="domain" required /></label>
            <label
              ><span data-i18n="title">Titel</span><input name="title" required autofocus
            /></label>
            <label
              ><span data-i18n="code">Code</span><input name="code" /><small data-i18n="codeHint"
                >Hints such as “voucher in your account” are often enough.</small
              ></label
            >
            <div class="row">
              <label
                ><span data-i18n="expiresAt">Ablaufdatum</span><input name="expiresAt" type="date"
              /></label>
            </div>
            <button type="submit" data-i18n="save">Speichern</button>
          </form>
        </div>
        <output id="status" aria-live="polite"></output>
      </section>
      <button id="options" class="secondary" data-i18n="options">Optionen öffnen</button>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
