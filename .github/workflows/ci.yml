name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run check:locales
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/packages/*.zip
