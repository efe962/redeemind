name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*.zip
          generate_release_notes: true

      - name: Trigger store publications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh workflow run "Publish to Chrome Web Store" --ref "$TAG" -f tag="$TAG"
          gh workflow run "Publish to Microsoft Edge Add-ons" --ref "$TAG" -f tag="$TAG"
          gh workflow run "Publish to Firefox Add-ons" --ref "$TAG" -f tag="$TAG"
