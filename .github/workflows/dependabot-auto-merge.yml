name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for Dependabot pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PULL_REQUEST_NUMBER" ]; then
            exit 0
          fi

          author="$(gh pr view "$PULL_REQUEST_NUMBER" --repo "$REPOSITORY" --json author --jq '.author.login')"
          if [ "$author" != "dependabot[bot]" ]; then
            exit 0
          fi

          gh pr merge "$PULL_REQUEST_NUMBER" \
            --repo "$REPOSITORY" \
            --match-head-commit "$HEAD_SHA" \
            --squash
